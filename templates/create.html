<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание операции</title>
    <link href="/static/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Создание новой операции</h1>
        <nav class="nav mb-3">
            <a class="nav-link" href="/">Вернуться к списку</a>
        </nav>

        <form method="post" id="operationForm">
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label for="ship_id" class="form-label">Судно</label>
                    <select class="form-select" id="ship_id" name="ship_id" required>
                        {% for ship in ships %}
                        <option value="{{ ship.id }}">{{ ship.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="port_id" class="form-label">Порт</label>
                    <select class="form-select" id="port_id" name="port_id" required>
                        {% for port in ports %}
                        <option value="{{ port.id }}">{{ port.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="contractor_id" class="form-label">Контрагент</label>
                    <select class="form-select" id="contractor_id" name="contractor_id" required>
                        {% for contractor in contractors %}
                        <option value="{{ contractor.id }}">{{ contractor.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="date" class="form-label">Дата</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ today }}" required>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="has_documents" name="has_documents">
                <label for="has_documents" class="form-check-label">Есть документы</label>
            </div>

            <!-- Кнопка добавления услуги -->
            <button type="button" class="btn btn-outline-success mb-3" data-bs-toggle="modal" data-bs-target="#addItemModal">
                <i class="fas fa-plus"></i> Добавить услугу
            </button>

            <!-- Таблица выбранных услуг -->
            <div class="table-responsive">
                <table class="table table-sm table-bordered" id="itemsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 50px"></th>
                            <th>Услуга</th>
                            <th style="width: 120px">Объём</th>
                            <th style="width: 140px">Стоимость</th>
                            <th style="width: 50px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Здесь будут добавляться строки через JS -->
                    </tbody>
                </table>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Создать операцию</button>
        </form>
    </div>

    <!-- Модальное окно выбора услуги -->
    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Выберите услугу</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row row-cols-2 row-cols-md-3 g-3">
                        {% for item in items %}
                        <div class="col">
                            <button type="button" class="btn btn-outline-primary w-100 text-start p-3 item-btn"
                                    data-item-id="{{ item.id }}"
                                    data-item-name="{{ item.name }}"
                                    onclick="addItemToTable({{ item.id }}, '{{ item.name }}')">
                                <div class="d-flex align-items-center gap-2">
                                    <div style="font-size: 1.5rem">
                                        {% if item.name == 'Питьевая вода' %}
                                        <i class="fas fa-water"></i>
                                        {% elif item.name == 'Хозфекальные воды' %}
                                        <i class="fas fa-tint-slash"></i>
                                        {% elif item.name == 'Шлам' %}
                                        <i class="fas fa-industry"></i>
                                        {% elif item.name == 'Бытовой мусор' %}
                                        <i class="fas fa-trash"></i>
                                        {% elif item.name == 'Пластик' %}
                                        <i class="fas fa-recycle"></i>
                                        {% elif item.name == 'Пищевые отходы' %}
                                        <i class="fas fa-utensils"></i>
                                        {% elif item.name == 'Кулинарный жир' %}
                                        <i class="fas fa-oil-can"></i>
                                        {% elif item.name == 'Эксплуатационные отходы' %}
                                        <i class="fas fa-tools"></i>
                                        {% elif item.name == 'Электронные отходы' %}
                                        <i class="fas fa-bolt"></i>
                                        {% elif item.name == 'Агентское вознаграждение' %}
                                        <i class="fas fa-handshake"></i>
                                        {% elif item.name == 'Опломбировка' %}
                                        <i class="fas fa-lock"></i>
                                        {% elif item.name == 'Ходовое время' %}
                                        <i class="fas fa-clock"></i>
                                        {% else %}
                                        <i class="fas fa-question"></i>
                                        {% endif %}
                                    </div>
                                    <div>
                                        <strong>{{ item.name }}</strong>
                                    </div>
                                </div>
                            </button>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const addedItems = new Set(); // Чтобы не добавлять дубли

        function addItemToTable(itemId, itemName) {
            if (addedItems.has(itemId)) {
                alert('Эта услуга уже добавлена');
                return;
            }

            addedItems.add(itemId);

            const tbody = document.querySelector('#itemsTable tbody');
            const row = document.createElement('tr');
            row.dataset.itemId = itemId;

            // Иконка
            const iconTd = document.createElement('td');
            const icon = document.querySelector(`[data-item-id="${itemId}"] i`).cloneNode(true);
            iconTd.appendChild(icon);
            iconTd.classList.add('text-center');

            // Название
            const nameTd = document.createElement('td');
            nameTd.textContent = itemName;

            // Объём
            const volumeTd = document.createElement('td');
            const volumeInput = document.createElement('input');
            volumeInput.type = 'number';
            volumeInput.step = '0.01';
            volumeInput.min = '0';
            volumeInput.className = 'form-control form-control-sm';
            volumeInput.name = `volume_${itemId}`;
            volumeInput.value = '0';
            volumeTd.appendChild(volumeInput);

            // Стоимость
            const costTd = document.createElement('td');
            const costInput = document.createElement('input');
            costInput.type = 'number';
            costInput.step = '0.01';
            costInput.min = '0';
            costInput.className = 'form-control form-control-sm';
            costInput.name = `cost_${itemId}`;
            costInput.value = '0';
            costTd.appendChild(costInput);

            // Удалить
            const deleteTd = document.createElement('td');
            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'btn btn-sm btn-danger';
            deleteBtn.innerHTML = '&times;';
            deleteBtn.onclick = function() {
                tbody.removeChild(row);
                addedItems.delete(itemId);
            };
            deleteTd.appendChild(deleteBtn);

            row.append(iconTd, nameTd, volumeTd, costTd, deleteTd);
            tbody.appendChild(row);

            // Закрыть модалку
            const modal = bootstrap.Modal.getInstance(document.getElementById('addItemModal'));
            modal.hide();
        }
    </script>
</body>
</html>
